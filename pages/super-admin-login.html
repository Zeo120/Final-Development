<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradigm | Restricted Access</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-container super-admin-auth-container">
      <section class="auth-form-panel">
        <div class="glass-card auth-card">
          <a class="auth-back" href="/admin-login">&larr; Back to Admin Console</a>

          <div class="auth-header">
            <div class="auth-brand auth-brand-spaced">
              <div class="auth-brand-copy">
                <span>Paradigm</span>
                <strong>System Console</strong>
              </div>
            </div>
            <h2 class="accent-heading">System Management</h2>
            <p>Privileged environment for system administrators.</p>
          </div>

          <form data-super-admin-login-form>
            <div class="form-group">
              <label for="super-admin-login-id">Super Admin ID</label>
              <input id="super-admin-login-id" name="superAdminId" type="text" class="form-control" placeholder="Root ID" autocomplete="username" required>
            </div>

            <div class="form-group">
              <label for="super-admin-login-password">System Password</label>
              <input id="super-admin-login-password" name="superAdminPassword" type="password" class="form-control" placeholder="********" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary" type="submit">Initialize Access</button>
            <div class="auth-status" data-super-admin-login-status></div>
          </form>
        </div>
      </section>
    </div>
  </div>
  <script src="../assets/js/password-toggle.js" defer></script>
  <script src="../assets/js/super-admin.js" defer></script>
</body>
</html>
